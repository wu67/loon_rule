name: Update from remote rules

on:
  schedule:
    - cron: '0 6 * * *'  # 每天 06:00 UTC 更新
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Run conversion
        run: node scripts/convert_to_loon_no_action.js

      - name: Commit and push if changed
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update from remote rules"
          add: "reject.txt ip.txt pcdn.txt proxy_ip.txt"
          token: "${{ secrets.AUTO_GEN_REJECTLIST }}"
